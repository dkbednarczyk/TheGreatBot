plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.4.1'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "thegreatbot" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}


repositories {
    mavenCentral()
}

configurations {
    shade
}

configurations.named("implementation") {
    extendsFrom(configurations.named("shade").get())
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    shade("com.fasterxml.jackson.core:jackson-databind:2.21.2")

    // JDA pulls in voice/crypto libraries we don't use for a text-only bot.
    shade("net.dv8tion:JDA:6.4.1") {
        transitive = false
    }
    shade("com.neovisionaries:nv-websocket-client:2.14")
    shade("com.squareup.okhttp3:okhttp-jvm:5.3.2")
    shade("org.apache.commons:commons-collections4:4.5.0")
    shade("net.sf.trove4j:core:3.1.0")
}

shadowJar {
    archiveClassifier.set('')
    configurations = [project.configurations.shade]
    mergeServiceFiles()

    // Keep embedded libraries isolated from anything already on the server classpath.
    relocate 'net.dv8tion',        "${project.group}.shaded.net.dv8tion"
    relocate 'okhttp3',            "${project.group}.shaded.okhttp3"
    relocate 'okio',               "${project.group}.shaded.okio"
    relocate 'com.fasterxml.jackson', "${project.group}.shaded.com.fasterxml.jackson"
    relocate 'com.neovisionaries', "${project.group}.shaded.com.neovisionaries"
    relocate 'gnu.trove',          "${project.group}.shaded.gnu.trove"
    relocate 'org.apache.commons.collections4', "${project.group}.shaded.org.apache.commons.collections4"
    // Do not relocate slf4j; Fabric provides the logging backend.
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    archiveClassifier.set('dev')
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

tasks.named("assemble") {
    dependsOn(tasks.named("shadowJar"))
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
